name: checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke checks
        shell: pwsh
        run: ./tests/run_checks.ps1
      - name: README exists
        run: test -f README.md && test -f docs/ARCHITECTURE.md
